# basic .paneru.toml
default_workspaces = 1

[options]
focus_follows_mouse = true
mouse_follows_focus = true
virtual_workspace_animations = true
reap_empty_workspaces = true
create_virtual_workspace_automatically = false
animation_speed = 8

[bindings]
window_manage = "alt - t"
window_fullwidth = "alt - f"
window_stack = "alt - s"
window_unstack = "alt + shift - s"
window_nextdisplay = "cmd + alt - j"
window_swap_west = "cmd + alt - h"
window_swap_east = "cmd + alt - l"
window_focus_west = "alt - h"
window_focus_east = "alt - l"
window_resize = "alt - r"
window_shrink = "alt + shift - r"
window_center = "alt - c"
quit = "ctrl + alt - q"

[swipe]
sensitivity = 0.25
deceleration = 4.0
continuous = true

[swipe.gesture]
fingers_count = 3
direction = "Natural"
vertical = false

[padding]
top = 8
bottom = 8
left = 8
right = 8

