prSections:
    - title: My Pull Requests
      filters: is:open author:@me org:spiderplus
    - title: Needs My Review
      filters: is:open review-requested:@me org:spiderplus
    - title: Involved
      filters: is:open involves:@me -author:@me org:spiderplus
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings:
  prs:
    - key: D
      name: diff
      command: >
        fish -ic "__herdr_open_tab --label 'diff #{{.PrNumber}}' --focus
        'gh pr diff {{.PrNumber}} -R {{.RepoName}} | delta --dark --paging=always --tabs=4 --true-color=auto --line-numbers'"
    - key: N
      name: nvim
      command: >
        fish -ic "gh-dash-pr-nvim
        --repo '{{.RepoName}}'
        --pr '{{.PrNumber}}'
        --repo-path '{{.RepoPath}}'
        --head-ref '{{.HeadRefName}}'"
    - key: I
      name: shell
      command: >
        fish -ic "gh-dash-pr-shell
        --repo '{{.RepoName}}'
        --pr '{{.PrNumber}}'
        --repo-path '{{.RepoPath}}'
        --head-ref '{{.HeadRefName}}'"
repoPaths:
    :owner/:repo: ~/git/github.com/:owner/:repo
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
    colors:
        text:
            primary: "#cdd6f4"
            secondary: "#89b4fa"
            inverted: "#11111b"
            faint: "#bac2de"
            warning: "#f9e2af"
            success: "#a6e3a1"
            error: "#f38ba8"
        background:
            selected: "#313244"
        border:
            primary: "#89b4fa"
            secondary: "#45475a"
            faint: "#313244"
pager:
    diff: "delta --dark --paging=always --tabs=4 --true-color=auto --line-numbers --width=variable"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
